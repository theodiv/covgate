name: Package Publishing

on:
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # check-release.sh compares HEAD with origin/main
          persist-credentials: false

      - name: Check version and branch
        id: version
        run: scripts/check-release.sh

      - name: Extract release notes
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" > release-notes.md

      - name: Upload release notes
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  ci:
    name: Run CI
    uses: ./.github/workflows/ci.yml

  build-package:
    name: Build package
    needs: [check, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:  # no pip cache: nothing another run wrote reaches published files
          python-version: "3.11"

      - name: Create virtual environment
        run: python -m venv --upgrade-deps .venv

      - name: Install release tools
        run: .venv/bin/pip install --group release

      - name: Set development version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" src/covgate/__init__.py
          grep -qxF "__version__ = \"$VERSION\"" src/covgate/__init__.py

      - name: Build sdist and wheel
        run: .venv/bin/python -m build

      - name: Check distributions with twine
        run: .venv/bin/twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: distributions
          path: dist/

  publish-pypi:
    name: Publish to ${{ github.event_name == 'push' && 'PyPI' || 'TestPyPI' }}
    needs: build-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'push' && 'https://pypi.org/p/covgate' || 'https://test.pypi.org/p/covgate' }}
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: distributions
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  github-release:
    name: Create GitHub release
    needs: [check, publish-pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes

      - name: Create release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --notes-file release-notes.md --prerelease="$PRERELEASE"
